name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public source manifest
        run: python3 tools/check-source-tree.py
      - name: Run policy and BO regression checks
        run: python3 tools/run-host-checks.py
